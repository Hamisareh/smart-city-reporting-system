events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream auth_api {
        server auth-service:8000;
    }

    upstream report_api {
        server report-service:8001;
    }

    upstream notification_api {
        server notification-service:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend static files
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # ✅ FIX: proxy_pass ends with / so nginx strips the location prefix.
        # Request: /api/auth/login/ → forwarded as /api/auth/login/ to auth-service ✅
        # Before fix it was: auth_api/api/auth/ which doubled the path.
        location /api/auth/ {
            proxy_pass http://auth_api/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth Service Django admin
        location /admin/ {
            proxy_pass http://auth_api/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ✅ FIX: Same fix — proxy_pass forwards correctly to report-service
        location /api/reports/ {
            proxy_pass http://report_api/api/reports/;
            proxy_set_header Authorization $http_authorization;  # ← ajouter ça
            proxy_pass_header Authorization;                     
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Report Service Django admin
        location /report-admin/ {
            proxy_pass http://report_api/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Notification service
        location /api/notifications/ {
            proxy_pass http://notification_api/api/notifications/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Media files served from report-service
        location /media/ {
            proxy_pass http://report_api/media/;
            proxy_set_header Host $host;
        }
    }
}