
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Dashboard - Smart City</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .navbar {
            background: white;
            border-radius: 15px;
            padding: 15px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .navbar h1 { color: #dc3545; }
        .navbar button {
            padding: 8px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .card h3 { margin-bottom: 15px; color: #333; }
        .btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-success { background: #28a745; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-danger { background: #dc3545; }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #dc3545;
            color: white;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .stat-card h2 {
            font-size: 2.5em;
            color: #dc3545;
        }
        .role-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .role-superadmin { background: #dc3545; color: white; }
        .role-admin { background: #ffc107; color: #333; }
        .role-user { background: #28a745; color: white; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 400px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <h1>👑 Super Admin Dashboard</h1>
            <div>
                <button onclick="window.location.href='dashboard.html'">📊 Dashboard</button>
                <button onclick="logout()">🚪 Déconnexion</button>
            </div>
        </div>

        <!-- Statistiques -->
        <div class="stats" id="stats">
            <div class="stat-card">
                <h2 id="totalUsers">0</h2>
                <p>Total Utilisateurs</p>
            </div>
            <div class="stat-card">
                <h2 id="totalAdmins">0</h2>
                <p>Admins</p>
            </div>
            <div class="stat-card">
                <h2 id="totalCitizens">0</h2>
                <p>Citoyens</p>
            </div>
        </div>

        <!-- Créer un Admin -->
        <div class="card">
            <h3>➕ Créer un nouvel Admin</h3>
            <form id="createAdminForm">
                <div class="input-group">
                    <label>Nom d'utilisateur</label>
                    <input type="text" id="adminUsername" required>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="adminEmail" placeholder="Email" autocomplete="email" required>
                </div>
                <div class="input-group">
                    <label>Mot de passe</label>
                    <input type="password" id="adminPassword" placeholder="Mot de passe" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-success">Créer Admin</button>
            </form>
            <div id="adminMessage" style="margin-top: 10px;"></div>
        </div>

        <!-- Liste des utilisateurs -->
        <div class="card">
            <h3>📋 Liste des utilisateurs</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Username</th><th>Email</th><th>Rôle</th><th>Date</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="usersList">
                        <tr><td colspan="6">Chargement...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Modifier Utilisateur -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>✏️ Modifier l'utilisateur</h3>
            <form id="editUserForm">
                <input type="hidden" id="editUserId">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="editUsername" required>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="editEmail" required>
                </div>
                <div class="input-group">
                    <label>Rôle</label>
                    <select id="editRole">
                        <option value="user">Citoyen</option>
                        <option value="admin">Admin</option>
                        <option value="superadmin">Super Admin</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success">Enregistrer</button>
                <button type="button" class="btn btn-warning" onclick="closeModal()">Annuler</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = '/api/auth';
        
        function getToken() { return localStorage.getItem('access_token'); }
        
        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
        
        async function loadStats() {
            const token = getToken();
            if (!token) return;
            try {
                const response = await fetch(`${API_URL}/users/`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const users = await response.json();
                    document.getElementById('totalUsers').textContent = users.length;
                    document.getElementById('totalAdmins').textContent = users.filter(u => u.role === 'admin').length;
                    document.getElementById('totalCitizens').textContent = users.filter(u => u.role === 'user').length;
                }
            } catch(e) { console.error(e); }
        }
        
        async function loadUsers() {
            const token = getToken();
            if (!token) return;
            try {
                const response = await fetch(`${API_URL}/users/`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const users = await response.json();
                    document.getElementById('usersList').innerHTML = users.map(u => `
                        <tr>
                            <td>${u.id}</td>
                            <td>${u.username}</td>
                            <td>${u.email || '-'}</td>
                            <td><span class="role-badge role-${u.role}">${u.role}</span></td>
                            <td>${new Date(u.created_at).toLocaleDateString()}</td>
                            <td>
                                <button class="btn btn-warning" onclick="openEditModal(${u.id}, '${u.username}', '${u.email}', '${u.role}')" style="padding:5px 10px; margin-right:5px;">✏️</button>
                                <button class="btn btn-danger" onclick="deleteUser(${u.id})" style="padding:5px 10px;">🗑️</button>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch(e) { console.error(e); }
        }
        
        async function deleteUser(userId) {
            if (!confirm('Voulez-vous vraiment supprimer cet utilisateur ?')) return;
            const token = getToken();
            try {
                const response = await fetch(`${API_URL}/users/${userId}/`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    alert('✅ Utilisateur supprimé !');
                    loadStats();
                    loadUsers();
                } else {
                    alert('❌ Erreur lors de la suppression');
                }
            } catch(e) { alert('❌ Erreur'); }
        }
        
        function openEditModal(id, username, email, role) {
            document.getElementById('editUserId').value = id;
            document.getElementById('editUsername').value = username;
            document.getElementById('editEmail').value = email;
            document.getElementById('editRole').value = role;
            document.getElementById('editModal').style.display = 'flex';
        }
        
        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }
        
        document.getElementById('editUserForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = getToken();
            const userId = document.getElementById('editUserId').value;
            try {
                const response = await fetch(`${API_URL}/users/${userId}/update/`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        username: document.getElementById('editUsername').value,
                        email: document.getElementById('editEmail').value,
                        role: document.getElementById('editRole').value
                    })
                });
                if (response.ok) {
                    alert('✅ Utilisateur modifié !');
                    closeModal();
                    loadStats();
                    loadUsers();
                } else {
                    alert('❌ Erreur lors de la modification');
                }
            } catch(e) { alert('❌ Erreur'); }
        });
        
        document.getElementById('createAdminForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = getToken();
            const msg = document.getElementById('adminMessage');
            try {
                const response = await fetch(`${API_URL}/create-admin/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        username: document.getElementById('adminUsername').value,
                        email: document.getElementById('adminEmail').value,
                        password: document.getElementById('adminPassword').value
                    })
                });
                if (response.ok) {
                    msg.style.color = 'green';
                    msg.textContent = '✅ Admin créé avec succès!';
                    document.getElementById('createAdminForm').reset();
                    loadStats();
                    loadUsers();
                } else {
                    const data = await response.json();
                    msg.style.color = 'red';
                    msg.textContent = '❌ ' + JSON.stringify(data);
                }
            } catch(e) { msg.style.color = 'red'; msg.textContent = '❌ Erreur'; }
        });
        
        // Vérifier que l'utilisateur est Super Admin
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (user.role !== 'superadmin') window.location.href = 'dashboard.html';
        
        loadStats();
        loadUsers();
    </script>
</body>
</html>
