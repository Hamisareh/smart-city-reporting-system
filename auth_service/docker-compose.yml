services:
  auth-service:
    build: .
    container_name: auth-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=auth_service.settings
      - TZ=Africa/Algiers
      - CONSUL_URL=http://consul:8500
      - RABBITMQ_HOST=rabbitmq
      - NOTIFICATION_SERVICE_URL=http://notification-service:5000
      - REPORT_SERVICE_URL=http://report-service:8001
      - SERVER_NAME=auth-server
      - SERVER_IP=192.168.100.102
    volumes:
      - .:/app
    networks:
      - wams-network  # ← CHANGÉ : auth-network → wams-network
    command: python manage.py runserver 0.0.0.0:8000

networks:
  wams-network:  # ← CHANGÉ
    external: true  # ← AJOUTÉ