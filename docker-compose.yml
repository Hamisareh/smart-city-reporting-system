services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    ports:
      - "80:80"       # Public HTTP traffic
      - "8080:8080"   # Traefik dashboard
    volumes:
      # Mount both config files — no Docker socket needed
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - smart-city-network

  # ============================================================
  # NGINX — Serves frontend static files (internal only)
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - smart-city-network

  # ============================================================
  # AUTH SERVICE
  # ============================================================
  auth-service:
    build: ./auth_service
    container_name: auth-service
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=auth_service.settings
      - TZ=Africa/Algiers
    volumes:
      - ./auth_service:/app
    networks:
      - smart-city-network
    command: python manage.py runserver 0.0.0.0:8000

  # ============================================================
  # REPORT SERVICE
  # ============================================================
  report-service:
    build: ./report_service
    container_name: report-service
    ports:
    - "8001:8001"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=report_service.settings
      - TZ=Africa/Algiers
    volumes:
      - ./report_service:/app
      - ./report_service/media:/app/media
    networks:
      - smart-city-network
    depends_on:
      - rabbitmq
    command: python manage.py runserver 0.0.0.0:8001

  # ============================================================
  # NOTIFICATION SERVICE
  # ============================================================
  notification-service:
    build: ./notification_service
    container_name: notification-service
    ports:                                  
    - "5000:5000"  
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=notification_service.settings
      - TZ=Africa/Algiers
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RUN_MAIN=true
    volumes:
      - ./notification_service:/app
    networks:
      - smart-city-network
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:5000

  # ============================================================
  # CONSUL — Service Registry / Discovery
  # ============================================================
  consul:
    image: hashicorp/consul:latest
    container_name: consul
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"
    networks:
      - smart-city-network


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - smart-city-network

networks:
  smart-city-network:
    driver: bridge